name: Deploy Hexo


on:
  push:
    branches:
      - main


permissions:
  contents: write
  pages: write
  id-token: write


jobs:

  build:

    runs-on: ubuntu-latest


    steps:

    - name: Checkout
      uses: actions/checkout@v4


    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: 20


    - name: Install
      run: npm install


    - name: Generate
      run: npm run build


    - name: Upload
      uses: actions/upload-pages-artifact@v3
      with:
        path: ./public


    - name: Deploy
      uses: actions/deploy-pages@v4